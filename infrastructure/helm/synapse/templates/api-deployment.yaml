apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synapse.fullname" . }}-api
  labels:
    {{- include "synapse.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "synapse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "synapse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "synapse.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: {{ include "synapse.fullname" . }}-api-env
            - secretRef:
                name: {{ .Values.api.existingSecret }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "synapse.fullname" . }}-api-env
  labels:
    {{- include "synapse.labels" . | nindent 4 }}
data:
  APP_BASE_URL: {{ .Values.global.appBaseUrl | quote }}
  NODE_ENV: "production"
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.api.env.otelExporterOtlpEndpoint | quote }}
  OTEL_SERVICE_NAME: "synapse-api"
  SSO_OIDC_PROVIDERS: {{ .Values.api.env.ssoOidcProviders | quote }}
  SANDBOX_PROVIDER: {{ .Values.api.env.sandboxProvider | quote }}
  PLATFORM_ADMIN_EMAILS: {{ .Values.api.env.platformAdminEmails | quote }}
  {{- if .Values.postgresql.external.enabled }}
  DATABASE_URL_SECRET_REF: {{ .Values.postgresql.external.existingSecret | quote }}
  PGHOST: {{ .Values.postgresql.external.host | quote }}
  PGPORT: {{ .Values.postgresql.external.port | quote }}
  PGDATABASE: {{ .Values.postgresql.external.database | quote }}
  PGUSER: {{ .Values.postgresql.external.username | quote }}
  {{- end }}
  {{- if .Values.redis.external.enabled }}
  REDIS_HOST: {{ .Values.redis.external.host | quote }}
  REDIS_PORT: {{ .Values.redis.external.port | quote }}
  {{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "synapse.fullname" . }}-api
  labels:
    {{- include "synapse.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "synapse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
