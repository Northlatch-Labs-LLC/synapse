# GridFrames deployment compose — gf-host (2026-09-28)
#
# Ops overlay for the Northlatch managed-cloud destination. The upstream
# docker-compose.yml stays the untouched self-hosted distribution (INV-S1);
# this file adapts the same image builds and env contract to the GridFrames
# edge pattern: Traefik terminates TLS, services are reached over the docker
# network, nothing is published on host ports.
#
# Required env (generated by deploy-gridframes.sh into /data/synapse/.env):
#   POSTGRES_PASSWORD REDIS_PASSWORD APP_SECRET BETTER_AUTH_SECRET
#   AUDIT_EXPORT_SIGNING_KEY APP_BASE_URL BASE_URL NEXT_PUBLIC_* EXPO_PUBLIC_API_URL

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-limit-small: &limit-small
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 1g

name: synapse

networks:
  default:
    name: synapse-internal
  edge:
    external: true
    name: xlaunch

volumes:
  pgdata:
    name: synapse_pgdata
  redisdata:
    name: synapse_redisdata
  api_storage:
    name: synapse_api_storage

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: synapse-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: synapse
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
    <<: *limit-small

  redis:
    image: redis:7-alpine
    container_name: synapse-redis
    restart: unless-stopped
    logging: *default-logging
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?required}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    networks:
      - default
    <<: *limit-small

  api:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.api
    image: localhost:5000/northlatch/synapse-api:0.28.0-gf1
    container_name: synapse-api
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    env_file:
      - /data/synapse/.env
    environment:
      DATABASE_URL: postgresql://synapse:${POSTGRES_PASSWORD}@postgres:5432/synapse
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NODE_ENV: production
      PORT: "3001"
      HOST: "0.0.0.0"
      STORAGE_DIR: /app/storage/files
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_LOCAL_URL: http://embed:8775/
      EMBEDDING_LOCAL_MODEL: bge-m3
      EMBEDDING_DIMENSION: "1024"
      OCR_PROVIDER: tesseract
      TESSERACT_URL: http://tesseract-ocr:8771/
      TESSERACT_LANGS: chi_sim+chi_tra+eng+jpn
      DOCUMENT_EXTRACTION_PROVIDER: local
      DOCEXTRACT_URL: http://docextract:8776/
      DOCEXTRACT_ENGINE_VERSION: tika-3.0.0
      SANDBOX_PROVIDER: none
      OTEL_SERVICE_NAME: synapse-api
    labels:
      - traefik.enable=true
      - traefik.docker.network=xlaunch
      - traefik.http.routers.synapse-api.rule=Host(`synapse.xlaunch.work`) && (PathPrefix(`/api/v1`) || PathPrefix(`/ws`))
      - traefik.http.routers.synapse-api.entrypoints=https
      - traefik.http.routers.synapse-api.tls=true
      - traefik.http.routers.synapse-api.tls.certresolver=letsencrypt
      - traefik.http.routers.synapse-api-http.rule=Host(`synapse.xlaunch.work`) && (PathPrefix(`/api/v1`) || PathPrefix(`/ws`))
      - traefik.http.routers.synapse-api-http.entrypoints=http
      - traefik.http.routers.synapse-api-http.middlewares=synapse-api-redirect
      - traefik.http.middlewares.synapse-api-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.synapse-api-redirect.redirectscheme.permanent=true
      - traefik.http.services.synapse-api.loadbalancer.server.port=3001
    volumes:
      - api_storage:/app/storage
      - ./packages/api/config:/app/packages/api/config:ro
    networks:
      - default
      - edge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4g

  web:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?required}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?required}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?required}
        API_PROXY_ORIGIN: http://api:3001
    image: localhost:5000/northlatch/synapse-web:0.28.0-gf1
    container_name: synapse-web
    restart: unless-stopped
    logging: *default-logging
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?required}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?required}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?required}
      API_PROXY_ORIGIN: http://api:3001
    labels:
      - traefik.enable=true
      - traefik.docker.network=xlaunch
      - traefik.http.routers.synapse-web.rule=Host(`synapse.xlaunch.work`)
      - traefik.http.routers.synapse-web.entrypoints=https
      - traefik.http.routers.synapse-web.tls=true
      - traefik.http.routers.synapse-web.tls.certresolver=letsencrypt
      - traefik.http.routers.synapse-web-http.rule=Host(`synapse.xlaunch.work`)
      - traefik.http.routers.synapse-web-http.entrypoints=http
      - traefik.http.routers.synapse-web-http.middlewares=synapse-web-redirect
      - traefik.http.middlewares.synapse-web-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.synapse-web-redirect.redirectscheme.permanent=true
      - traefik.http.services.synapse-web.loadbalancer.server.port=3000
    networks:
      - default
      - edge
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  tesseract-ocr:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.tesseract
    container_name: synapse-tesseract-ocr
    restart: unless-stopped
    logging: *default-logging
    environment:
      TESSERACT_HOST: 0.0.0.0
      TESSERACT_PORT: "8771"
      TESSERACT_DEFAULT_LANGS: chi_sim+chi_tra+eng+jpn
    networks:
      - default
    <<: *limit-small

  docextract:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.docextract
    container_name: synapse-docextract
    restart: unless-stopped
    logging: *default-logging
    environment:
      TIKA_VERSION: 3.0.0
    networks:
      - default
    <<: *limit-small

  embed:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.embed
    container_name: synapse-embed
    restart: unless-stopped
    logging: *default-logging
    environment:
      EMBED_MODEL: bge-m3
      EMBED_HOST: 0.0.0.0
      EMBED_PORT: "8775"
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3g
