name: verify-boundary

# Enforcing layer for the DB / DTO / Wire boundary refactor
# (docs/architecture-boundary-refactor-master-plan.md). The root `npm test` /
# `npm run typecheck` only cover packages/api, and mobile-app is not in the root
# workspace — so a green root build never proved the boundary-refactor clients +
# protocol packages were safe (round-6 P2-3). This workflow runs the single
# `verify:boundary` gate: build the dependency chain, run guard:layering +
# guard:datetime + audit:business-enums, typecheck web-next + mobile-app, and
# run the test suites across every boundary-bearing package.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-boundary:
    runs-on: ubuntu-latest
    env:
      # The fs-helper is a Rust sidecar not needed for the boundary contract;
      # let pretest skip its rebuild so the gate is deterministic in CI. The
      # helper-backed test cases skip cleanly when the binary is absent.
      ALLOW_MISSING_FS_HELPER: "1"
    steps:
      - uses: actions/checkout@v4
        # Bundle sidecar archives are git-LFS objects; checkout@v4 skips LFS
        # content by default, leaving pointer files whose sha256 can never match
        # the manifest — the requirePrestaged suites then fail on "no matching
        # archive" although the archives are committed.
        with:
          lfs: true
      - name: Install sandbox plane prerequisites + enable userns
        # The boundary gate runs device-runtime's full suite, whose bwrap-backed
        # exec/VFS tests need (a) the bubblewrap + ripgrep binaries and (b)
        # unprivileged user namespaces actually permitted — ubuntu-latest 24.04
        # ships AppArmor's userns restriction ON, so the binary resolves but
        # every jail spawn is denied and the tests fail on misleading
        # assertions. `|| true` keeps older images (no such key) portable.
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap ripgrep libx11-dev libxtst-dev libxkbfile-dev
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install mobile-app dependencies
        # mobile-app is outside the root workspace, so npm ci above doesn't
        # install it; its typecheck (pretypecheck → sync:shared → tsc) needs
        # its own node_modules.
        run: npm --prefix packages/mobile-app ci
      - name: Build fs-helper (release profile)
        # The API suites inside verify:boundary resolve the RELEASE fs-helper
        # profile; build it so helper-backed cases run for real. The step env
        # neutralizes the job-level ALLOW_MISSING_FS_HELPER=1 (which skips the
        # script itself); tests still see the job-level opt-out for freshness.
        env:
          ALLOW_MISSING_FS_HELPER: ""
        run: bash scripts/pretest-fs-helper.sh release
      - name: verify:boundary
        run: npm run verify:boundary
