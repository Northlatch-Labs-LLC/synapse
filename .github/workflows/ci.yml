name: ci

# Blocking gate ladder — SYNAPSE-HANDOUT §4.4/§7 (DevOps standard, identical to
# the Latch program). Gates run IN ORDER within one job so no later gate can go
# green while an earlier one is red:
#   install → brand-lint → audit (runtime, critical) → lint → typecheck → test
# The image scan runs only after that ladder is green (needs: gates).
#
# Node 22 matches the upstream verify-boundary workflow's toolchain; the local
# dev toolchain (node 26 / npm 12) additionally needs --allow-remote=cdn.sheetjs.com
# for the xlsx remote tarball (npm 12 disables remote deps by default; npm 10,
# bundled with node 22, does not — so no flag is needed here).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    services:
      # The api unit suite has modules that construct real ioredis clients at
      # module scope; without a reachable Redis they retry forever and hang the
      # suite (see evidence/phase0/test-baseline.txt, run 2).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # With the release-profile helper built below, this only relaxes the
      # freshness preflight — presence is guaranteed, so helper-backed cases
      # (S12 applyManifest et al.) run for real instead of skipping.
      ALLOW_MISSING_FS_HELPER: "1"
    steps:
      - uses: actions/checkout@v4
        # Bundle sidecar archives are git-LFS objects; checkout@v4 skips LFS
        # content by default, leaving pointer files whose sha256 can never match
        # the manifest — the requirePrestaged suites then fail on "no matching
        # archive" although the archives are committed.
        with:
          lfs: true
      - name: Install sandbox plane prerequisites
        # 33 sandbox contract tests (local-bare-plane / core-catalog / data-plane
        # suites) exercise bwrap isolation and ripgrep-backed search; without
        # them the plane fail-closes with runtime_constraint and the tests fail
        # (macOS dev hosts see exactly this — platform-gated, not regressions).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap ripgrep libx11-dev libxtst-dev libxkbfile-dev libxcomposite-dev libxrandr-dev libxfixes-dev libxinerama-dev libxcursor-dev
      - name: Enable unprivileged user namespaces (make bwrap actually usable)
        # ubuntu-latest (24.04) ships AppArmor's userns restriction ON: the
        # bwrap BINARY resolves (so bwrapAvailable() passes) but every jail
        # spawn is denied at runtime — the first exec dies, releases its
        # concurrency slot, and B5/R3.7 fail on misleading assertions (the
        # "flaky on CI" class). Lift the restriction so confinement tests run
        # real jails. Older images (22.04) lack the key; `|| true` keeps this
        # step portable.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build fs-helper (release profile)
        # The API's materializer resolves the RELEASE profile only, while
        # device-runtime's pretest hook builds debug by default — S12 failed
        # with "binary not found" for exactly that mismatch. Build release
        # before any test runs (AFTER npm ci — the resolver probe needs tsx from node_modules). The step-level env neutralizes the job-level
        # ALLOW_MISSING_FS_HELPER=1, which otherwise makes the script skip
        # its own build ("${VAR:-0}" treats empty as unset).
        env:
          ALLOW_MISSING_FS_HELPER: ""
        run: bash scripts/pretest-fs-helper.sh release
      - name: Brand lint (INV-S3)
        run: node scripts/brand-lint.mjs
      - name: Runtime dependency audit (INV-S7)
        run: npm audit --omit=dev --audit-level=critical
      - name: Lint (zero-waiver)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + contract suites (behavior oracle)
        run: |
          npm test
          npm run test:conformance
      - name: Boundary verification
        run: |
          npm --prefix packages/mobile-app ci
          npm run verify:boundary

  image-scan:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Bundle sidecar archives are git-LFS objects; checkout@v4 skips LFS
        # content by default, leaving pointer files whose sha256 can never match
        # the manifest — the requirePrestaged suites then fail on "no matching
        # archive" although the archives are committed.
        with:
          lfs: true
      - name: Build api image
        run: docker build -f infrastructure/Dockerfile.api -t synapse-api:ci .
      - name: Trivy scan (CRITICAL/HIGH block, INV-S7/S8)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: synapse-api:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
      - name: Build web image
        run: docker build -f infrastructure/Dockerfile.web -t synapse-web:ci .
      - name: Trivy scan web image
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: synapse-web:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
